<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Admissions - Kindernest Preschool</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>

  <!-- Header -->
  <header class="site-header">
    <div class="nav-wrap">
      <div class="site-brand">
        <img src="img/logo.jpg" alt="KinderNest Logo">
        <span>KinderNest</span>
      </div>
      <nav class="main-nav">
        <ul class="nav-list">
          <li><a href="index.html">Home</a></li>
          <li><a href="about.html">About</a></li>
          <li><a href="programs.html">Programs</a></li>
          <li><a href="admissions.html" class="active">Admissions</a></li>

          <li><a href="contact.html">Contact</a></li>
        </ul>
      </nav>
    </div>
  </header>

  <!-- Main Section -->
  <main>
    <section class="admission-form">
      <h1>Admissions Enquiry</h1>
      <p>Please complete the form below to enquire about admissions for your child.</p>

      <form>
        <label for="name">Parent/Guardian Name:</label>
        <input type="text" id="name" name="name" placeholder="Your Name">

        <label for="email">Email:</label>
        <input type="email" id="email" name="email" placeholder="you@example.com">

        <label for="phone">Phone Number:</label>
        <input type="text" id="phone" name="phone" placeholder="+27 11 123 4567">

        <label for="child_age">Child’s Age:</label>
        <input type="text" id="child_age" name="child_age" placeholder="Age in years">

        <label for="message">Message/Enquiry:</label>
        <textarea id="message" name="message" rows="5" placeholder="Write your enquiry here"></textarea>

        <input type="submit" value="Submit Enquiry" class="btn">
      </form>
    </section>
  </main>

  <!-- Footer -->
  <footer class="site-footer">
    <blockquote>“Education is not preparation for life; education is life itself.” — John Dewey</blockquote>
